<svg xmlns="http://www.w3.org/2000/svg" width="220" height="160" viewBox="0 0 220 160">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="220" height="160" fill="#000000"/>
  <!-- pod rack: five live pods, one reaped -->
  <g filter="url(#glow)">
    <rect x="41" y="37" width="34" height="34" fill="none" stroke="#00ff00" stroke-width="3"/>
    <rect x="93" y="37" width="34" height="34" fill="none" stroke="#ffa500" stroke-width="3" opacity="0.8"/>
    <rect x="145" y="37" width="34" height="34" fill="none" stroke="#ffa500" stroke-width="3" opacity="0.8"/>
    <rect x="41" y="89" width="34" height="34" fill="none" stroke="#ffa500" stroke-width="3" opacity="0.8"/>
    <rect x="93" y="89" width="34" height="34" fill="none" stroke="#ffa500" stroke-width="3" opacity="0.3" stroke-dasharray="5,5"/>
    <g stroke="#ffa500" stroke-width="3">
      <line x1="98" y1="94" x2="122" y2="118"/>
      <line x1="122" y1="94" x2="98" y2="118"/>
    </g>
    <rect x="145" y="89" width="34" height="34" fill="none" stroke="#ffa500" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
